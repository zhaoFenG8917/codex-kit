[package]
name = "codex-kit"
version = "0.1.0"
edition = "2021"
description = "Cross-platform system-operation CLI toolkit for AI coding agents"
license = "MIT"
readme = "README.md"
keywords = ["cli", "ai-agent", "llm", "system", "windows"]
categories = ["command-line-utilities"]
repository = "https://github.com/zhaoFenG8917/codex-kit"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
colored = "2"
glob = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
